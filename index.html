<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D-karta</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/npc.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/wiki.css">
    <link rel="stylesheet" href="css/player-tools.css">
</head>
<body>

<div id="app">

    <div id="map"></div>

    <div id="wiki-sidebar">

    <div id="search-container">
        <input
            id="search"
            type="text"
            placeholder="Search..."
            autocomplete="off">

        <div id="search-results"></div>
    </div>

    <div class="wiki-navigation">

        <button id="wiki-back">←</button>

        <button id="wiki-forward">→</button>

    </div>

    <div id="article-layout">

        <aside id="article-sidebar"></aside>

        <main id="article"></main>

    </div>

    </div>

</div>

<div id="wiki-preview"></div>


<div id="editor">

    <button id="editor-toggle">🛠</button>

    <div id="editor-panel">
        <button id="camera-tool">
            Camera Tool
        </button>
        <button id="draw-polygon">
            Draw Polygon
        </button>
        <button id="draw-road">
            Draw Road
        </button>
        <button id="edit-shape">
            Edit Shape
        </button>
        <button id="move-settlement">
            Move Settlement
        </button>

    </div>

</div>

<div id="player-tools">

    <button id="player-tools-toggle">👥</button>

    <div id="player-tools-panel">
        <div id="player-status">
            <div class="player-status-label">Logged in as:</div>
            <div id="player-status-display">No one</div>
        </div>

        <div id="player-login">
            <select id="player-select">
                <option value="">No one</option>
            </select>
        </div>
    </div>

</div>

<div id="road-form" class="editor-form" style="display:none;">

    <div class="editor-form-title">
        New Road
    </div>

    <label>
        Name
        <input id="road-name" type="text">
    </label>

    <label>
        Class
        <select id="road-class">
            <option value="path">Path</option>
            <option value="trail">Trail</option>
            <option value="road" selected>Road</option>
            <option value="highway">Highway</option>
        </select>
    </label>

    <label>
        Wiki article
        <input id="road-article" type="text">
    </label>

    <div class="editor-form-buttons">
        <button id="road-cancel">Cancel</button>
        <button id="road-create">Create</button>
    </div>

</div>

<div id="camera-info"></div>

<!-- Resources -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- Config -->
<script src="js/config.js"></script>
<script src="js/gm.js"></script>

<!-- Map -->
<script src="js/map/map.js"></script>
<script src="js/map/layers.js"></script>
<script src="js/map/world.js"></script>
<script src="js/map/navigation.js"></script>
<script src="js/renderers/lineRenderer.js"></script>
<script src="js/map/layers/roadStyles.js"></script>
<script src="js/map/layers/roads.js"></script>

<!-- Utils -->
<script src="js/utils/frontmatter.js"></script>

<!-- Renderers -->
<script src="js/renderers/images.js"></script>
<script src="js/renderers/links.js"></script>
<script src="js/renderers/years.js"></script>
<script src="js/renderers/gmNotes.js"></script>
<script src="js/renderers/markdown.js"></script>

<!-- Wiki -->
<script src="js/wiki/articleRegistry.js"></script>
<script src="js/wiki/articles/npc.js"></script>
<script src="js/wiki/articles/settlements.js"></script>
<script src="js/wiki/articles/nations.js"></script>
<script src="js/wiki/articles.js"></script>
<script src="js/wiki/sidebar.js"></script>
<script src="js/wiki/permissions.js"></script>
<script src="js/ui/article.js"></script>
<script src="js/ui/playerTools.js"></script>
<script src="js/wiki/wiki.js"></script>
<script src="js/wiki/search.js"></script>
<script src="js/wiki/history.js"></script>

<!-- Editor -->
<script src="js/editor/state.js"></script>
<script src="js/editor/editorRegistry.js"></script>
<script src="js/editor/editMode.js"></script>
<script src="js/editor/toolbar.js"></script>
<script src="js/editor/refresh.js"></script>
<script src="js/editor/drawLineTool.js"></script>
<script src="js/editor/shapeHandles.js"></script>
<script src="js/editor/build/cameraTool.js"></script>
<script src="js/editor/build/drawPolygon.js"></script>
<script src="js/editor/build/drawRoad.js"></script>
<script src="js/editor/build/editShape.js"></script>
<script src="js/editor/build/moveSettlement.js"></script>

<!-- Start -->
<script src="js/main.js"></script>

</body>
</html>
